[project]
name = "ai4sci-molecule"
version = "0.1.0"
description = "Week-by-week molecular machine learning exercises using ESOL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.0",
    "pandas>=2.2.3",
    "rdkit>=2024.9.4",
    "scikit-learn>=1.6.0",
    "seaborn>=0.13.2",
    "torch-geometric>=2.6.1",
]

[dependency-groups]
cpu = [
    "torch>=2.6.0",
]
dev = [
    "pytest>=8.3.4",
]
gpu = [
    "torch>=2.6.0",
]

[tool.uv]
conflicts = [
    [
        { group = "cpu" },
        { group = "gpu" },
    ],
]
default-groups = ["dev", "gpu"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu130", group = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: tests that load the downloaded ESOL dataset",
]
